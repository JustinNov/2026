<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Nina</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #ffe6e6;
            font-family: 'Arial', sans-serif;
            overflow: hidden; 
        }

        h1 {
            color: #ff4d4d;
            font-size: 3rem;
            text-align: center;
            margin-bottom: 20px;
            user-select: none;
        }

        .gif-container {
            margin-bottom: 20px;
            text-align: center;
        }
        
        /* Make the image responsive but max width 300px */
        .gif-container img {
            width: 300px; 
            border-radius: 10px;
            max-width: 90vw;
        }

        .buttons {
            display: flex;
            gap: 20px;
            width: 100%;
            justify-content: center;
            align-items: center;
            height: 60px; 
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            z-index: 100;
            position: relative; 
        }

        #yesBtn {
            background-color: #28a745;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        #yesBtn:hover {
            transform: scale(1.1);
            background-color: #218838;
        }

        #noBtn {
            background-color: #dc3545;
            color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: visible; 
        }

        /* --- THE CSS LEGS --- */
        .legs-container {
            position: absolute;
            top: 100%; 
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            display: none; 
            z-index: -1;
        }

        .leg {
            position: absolute;
            width: 8px;
            height: 25px;
            background-color: #333; 
            border-radius: 5px;
            top: -5px; 
            transform-origin: top center; 
        }

        .leg.left { left: 8px; }
        .leg.right { right: 8px; }

        /* --- ANIMATIONS --- */
        @keyframes wobble {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes run {
            0% { transform: rotate(40deg); }
            100% { transform: rotate(-40deg); }
        }

        .running {
            animation: wobble 0.1s infinite;
        }

        .running .legs-container {
            display: block;
        }

        .running .leg.left {
            animation: run 0.15s infinite alternate ease-in-out;
        }

        .running .leg.right {
            animation: run 0.15s infinite alternate-reverse ease-in-out;
        }

    </style>
</head>
<body>

    <div class="gif-container">
        <img id="mainGif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3R6eW50Z2dvY3A2bnJ6Z2V6bWZ6bW50Z2dvY3A2bnJ6Z2V6bWZ6bSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/26BRv0ThflsHCqDrG/giphy.gif" alt="Cute Bear">
    </div>

    <h1 id="question">Will you be my Valentine?</h1>

    <div class="buttons">
        <button id="yesBtn">Yes</button>
        <button id="noBtn">No</button>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const question = document.getElementById('question');
        const gif = document.getElementById('mainGif');

        // Draw Legs
        const legsContainer = document.createElement('div');
        legsContainer.className = 'legs-container';
        const leftLeg = document.createElement('div');
        leftLeg.className = 'leg left';
        legsContainer.appendChild(leftLeg);
        const rightLeg = document.createElement('div');
        rightLeg.className = 'leg right';
        legsContainer.appendChild(rightLeg);
        noBtn.appendChild(legsContainer);

        let isRunning = false;
        let btnX = 0;
        let btnY = 0;

        document.addEventListener('mousemove', (e) => {
            const btnRect = noBtn.getBoundingClientRect();
            const btnCenterX = btnRect.left + btnRect.width / 2;
            const btnCenterY = btnRect.top + btnRect.height / 2;

            const mouseX = e.clientX;
            const mouseY = e.clientY;

            const deltaX = btnCenterX - mouseX;
            const deltaY = btnCenterY - mouseY;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

            if (distance < 200) {
                if (!isRunning) {
                    isRunning = true;
                    btnX = btnRect.left;
                    btnY = btnRect.top;
                    document.body.appendChild(noBtn);
                    noBtn.style.position = 'absolute';
                    noBtn.style.left = btnX + 'px';
                    noBtn.style.top = btnY + 'px';
                    noBtn.classList.add('running');
                }

                const angle = Math.atan2(deltaY, deltaX);
                const moveStep = 15 + (200 - distance) * 0.2; 
                btnX += Math.cos(angle) * moveStep;
                btnY += Math.sin(angle) * moveStep;

                const padding = 50;
                const maxX = window.innerWidth - btnRect.width - padding;
                const maxY = window.innerHeight - btnRect.height - padding;

                if (btnX < padding) btnX = padding;
                if (btnX > maxX) btnX = maxX;
                if (btnY < padding) btnY = padding;
                if (btnY > maxY) btnY = maxY;

                noBtn.style.left = btnX + 'px';
                noBtn.style.top = btnY + 'px';
            }
        });

        yesBtn.addEventListener('click', () => {
            // 1. Change Text
            question.innerHTML = "Nina is my Valentine!!!!";
            
            // 2. Change GIF to "Carlton Dance" (Fresh Prince)
            // This link is usually very reliable
            gif.src = "https://media.giphy.com/media/pa37AAGzKXoek/giphy.gif";
            
            // 3. Hide Buttons
            yesBtn.style.display = 'none';
            noBtn.style.display = 'none';
        });
    </script>
</body>
</html>
